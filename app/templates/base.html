<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}Translation Sidecar{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 1100px; }
    nav a { margin-right: 1rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
    .pill { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 4px; background: #eee; }
    .ok { background: #d4edda; }
    .warn { background: #fff3cd; }
    .err { background: #f8d7da; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav>
    <a href="/ui/">Dashboard</a>
    <a href="/ui/queue">Queue</a>
    <a href="/health">Health JSON</a>
    <a href="/ui/logout">Logout</a>
  </nav>
  <hr />
  {% block content %}{% endblock %}
</body>
</html>
