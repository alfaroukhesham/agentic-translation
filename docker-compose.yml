# Translation sidecar — dispatcher only.
#
# MinIO is expected from /root/visatop/storage (or any host on :9000):
#   cd ../storage && docker compose up -d
#
# The dispatcher reaches MinIO via host.docker.internal (Linux: host-gateway).
# Presigned URLs use STORAGE_PUBLIC_ENDPOINT from .env (must be reachable by WordPress).

services:
  dispatcher:
    build: .
    container_name: translation-dispatcher
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATA_DIR: /data
      # Inside the container, 127.0.0.1 is the container — use the host MinIO port.
      STORAGE_ENDPOINT: http://host.docker.internal:9000
      # STORAGE_PUBLIC_ENDPOINT, credentials, bucket, etc. come from .env (env_file)
      PROMPT_PATH: /app/prompt-blogs.md
      NEWS_PROMPT_PATH: /app/prompt-news.md
      PAGE_ACF_PROMPT_PATH: /app/prompt-page-acf.md
    volumes:
      - translation-data:/data
    ports:
      # Public bind — /v1 requires API_SECRET; /ui uses session login.
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional all-in-one dev stack (conflicts with /storage MinIO on :9000).
  minio:
    profiles: ["bundled-minio"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

volumes:
  translation-data:
  minio-data:
